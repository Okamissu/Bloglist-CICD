name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Lint
        run: npm run lint

      - name: Backend tests
        run: npm run backend:test
        env:
          TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          SECRET: ${{ secrets.SECRET }}

      - name: Start backend
        run: npm run backend > backend.log 2>&1 &
        env:
          TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
          SECRET: ${{ secrets.SECRET }}

      - name: Start frontend
        run: npm run frontend -- --host 0.0.0.0 > frontend.log 2>&1 &

      - name: Wait for servers
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3001 > /dev/null; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done

          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5173 > /dev/null; then
              echo "Frontend is ready"
              break
            fi
            echo "Waiting for frontend..."
            sleep 2
          done

      - name: Frontend tests
        run: npm run frontend:test

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "===== BACKEND LOG ====="
          cat backend.log || true
          echo "===== FRONTEND LOG ====="
          cat frontend.log || true

      - name: Build
        run: npm run build
